# purge() and purge(date) drop the product's caches: every read after them answers the same
inputs:
  pv.2026-10-27.jsonl: {pv: {n: 12, scenarios: 2, seed: 13}}
config: |
  source:
    files: '${in}/*.jsonl'
    id: POSITION_ID
    promote: [LEGAL_ENTITY, DESK, TT_BOOK, TRADE_ID, QUANTITY, BASE_PV, CCY]
    vectors: [SCENARIO_PV]
  target:
    format: ${store}
    path: '${lake}/risk/scenario-pv'
    domain: risk
    kind: scenario-pv
steps:
  - load: []
  - store: [read-purge, '${store}', '${lake}', risk, scenario-pv, '2026-10-27']
