# a vector column with text columns: every row once, a null vector as length -1, the same order with one decoder and with four
inputs:
  pv.2026-10-27.jsonl: {pv: {n: 60, scenarios: 40, seed: 10}}
  gaps.2026-10-27.jsonl: |
    {"POSITION_ID":"P-9000002","BUSINESS_DATE":"2026-10-27","DESK":"DESK-FX","SCENARIO_PV":null}
config: |
  source:
    files: '${in}/*.jsonl'
    id: POSITION_ID
    promote: [LEGAL_ENTITY, DESK, TT_BOOK, TRADE_ID, QUANTITY, BASE_PV, CCY]
    vectors: [SCENARIO_PV]
  target:
    format: ${store}
    path: '${lake}/risk/scenario-pv'
    domain: risk
    kind: scenario-pv
steps:
  - load: []
  - store: [read-vectors, '${store}', '${lake}', risk, scenario-pv, '2026-10-27', SCENARIO_PV, DESK, TT_BOOK, QUANTITY]
