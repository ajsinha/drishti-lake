# the read API's health: a lake with a table, and a root that is not there; the same words on every store
inputs:
  pv.2026-10-27.jsonl: {pv: {n: 6, scenarios: 2, seed: 1}}
config: |
  source:
    files: '${in}/*.jsonl'
    id: POSITION_ID
    promote: [LEGAL_ENTITY, DESK, TT_BOOK, TRADE_ID, QUANTITY, BASE_PV, CCY]
    vectors: [SCENARIO_PV]
  target:
    format: ${store}
    lake: '${lake}'
    domain: risk
    kind: scenario-pv
steps:
  - load: []
  - store: [read-health, '${store}', '${lake}', risk, scenario-pv]
  - store: [read-health, '${store}', '${lake}/nowhere', risk, scenario-pv]
