# from: LakeLoad --key, --as-of
inputs:
  trades.jsonl: |
    {"TRADE_ID":"T1","DESK":"A","BASE_PV":1}
    {"TRADE_ID":"T2","DESK":"B","BASE_PV":2}
config: |
  source:
    files: '${in}/*'
    id: POSITION_ID
    promote: [LEGAL_ENTITY, DESK, TT_BOOK, TRADE_ID, QUANTITY, BASE_PV, CCY, POSITION_ID]
    vectors: [SCENARIO_PV]
  target:
    format: ${store}
    lake: '${lake}'
    domain: risk
    kind: scenario-pv
steps:
  - load: [--key, TRADE_ID, --as-of, '2026-11-02']
