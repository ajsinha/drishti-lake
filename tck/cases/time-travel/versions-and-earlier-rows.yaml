# time travel through the TableStore SPI on every store: a table's versions, and its rows as of an earlier version (by the version and by
# its commit time) after a second date and a replace of the first; a version no store holds is refused by the same words
inputs:
  pv.2026-10-27.jsonl: {pv: {n: 12, scenarios: 2, seed: 1}}
  next/pv.2026-10-28.jsonl: {pv: {n: 8, scenarios: 2, seed: 2, start: '2026-10-28'}}
  again/pv.2026-10-27.jsonl: {pv: {n: 5, scenarios: 2, seed: 99}}
configs:
  main: |
    source: {files: '${in}/pv.2026-10-27.jsonl', id: POSITION_ID, promote: [DESK], vectors: [SCENARIO_PV]}
    target: {format: ${store}, path: '${lake}/risk/scenario-pv', domain: risk, kind: scenario-pv}
  next: |
    source: {files: '${in}/next/pv.2026-10-28.jsonl', id: POSITION_ID, promote: [DESK], vectors: [SCENARIO_PV]}
    target: {format: ${store}, path: '${lake}/risk/scenario-pv', domain: risk, kind: scenario-pv}
  again: |
    source: {files: '${in}/again/pv.2026-10-27.jsonl', id: POSITION_ID, promote: [DESK], vectors: [SCENARIO_PV]}
    target: {format: ${store}, path: '${lake}/risk/scenario-pv', domain: risk, kind: scenario-pv, mode: replace-date}
steps:
  - load: {args: [--run-id, tck-first]}
  - load: {config: next, args: [--run-id, tck-second]}
  - load: {config: again, args: [--run-id, tck-third]}
  - store: [versions, '${store}', '${lake}', risk, scenario-pv]
  - store: [scan-at, '${store}', '${lake}', risk, scenario-pv, '0']
  - store: [scan-at, '${store}', '${lake}', risk, scenario-pv, '1']
  - store: [scan-at, '${store}', '${lake}', risk, scenario-pv, '1', time]
  - store: [scan-at, '${store}', '${lake}', risk, scenario-pv, '2']
  - store: [scan-at, '${store}', '${lake}', risk, scenario-pv, '-1']
