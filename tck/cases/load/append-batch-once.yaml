# an append naming its batch is committed once per date: the second run of batch b1 is skipped, on every store
inputs:
  pv.2026-10-27.jsonl: {pv: {n: 12, scenarios: 2, dates: 1, seed: 1}}
  pv.2026-10-28.jsonl: {pv: {n: 12, scenarios: 2, dates: 1, seed: 2, start: '2026-10-28'}}
config: |
  source:
    files: '${in}/*'
    id: POSITION_ID
    promote: [DESK, QUANTITY]
    vectors: [SCENARIO_PV]
  target:
    format: ${store}
    path: '${lake}/risk/scenario-pv'
    domain: risk
    kind: scenario-pv
    mode: append
    batch-id: b1
steps:
  - load: []
  - load: []
