# from: LakeLoadTest.eachDateIsOneCommitAndARerunReplacesTheDate (second load)
inputs:
  pv.2026-10-27.jsonl: {pv: {n: 30, scenarios: 3, seed: 1}}
  again/pv.2026-10-27.jsonl: {pv: {n: 20, scenarios: 3, seed: 99}}
configs:
  main: |
    source: {files: '${in}/pv.2026-10-27.jsonl', id: POSITION_ID, promote: [DESK, BASE_PV], vectors: [SCENARIO_PV]}
    target: {format: ${store}, path: '${lake}/risk/scenario-pv', domain: risk, kind: scenario-pv}
  again: |
    source: {files: '${in}/again/pv.2026-10-27.jsonl', id: POSITION_ID, promote: [DESK, BASE_PV], vectors: [SCENARIO_PV]}
    target: {format: ${store}, path: '${lake}/risk/scenario-pv', domain: risk, kind: scenario-pv, mode: replace-date}
  more: |
    source: {files: '${in}/again/pv.2026-10-27.jsonl', id: POSITION_ID, promote: [DESK, BASE_PV], vectors: [SCENARIO_PV]}
    target: {format: ${store}, path: '${lake}/risk/scenario-pv', domain: risk, kind: scenario-pv, mode: append}
steps:
  - load: []
  - load: {config: again}
  - load: {config: more}
