# from: DeleteDatesParityTest
inputs:
  pv.2026-10-27.jsonl: {pv: {n: 30, scenarios: 3, dates: 1, seed: 1}}
  pv.2026-10-28.jsonl: {pv: {n: 30, scenarios: 3, dates: 1, seed: 2, start: '2026-10-28'}}
  pv.2026-10-29.jsonl: {pv: {n: 30, scenarios: 3, dates: 1, seed: 3, start: '2026-10-29'}}
config: |
  source:
    files: '${in}/*'
    id: POSITION_ID
    promote: [LEGAL_ENTITY, DESK, TT_BOOK, TRADE_ID, QUANTITY, BASE_PV, CCY, POSITION_ID]
    vectors: [SCENARIO_PV]
  target:
    format: ${store}
    lake: '${lake}'
    domain: risk
    kind: scenario-pv
steps:
  - load: []
  - retention: [--lake, '${lake}', --format, '${store}', --table, risk/scenario-pv, --dates, '2026-10-27,2026-10-29']
