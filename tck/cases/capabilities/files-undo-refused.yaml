# the files store cannot UNDO (declared): the store refuses with the reason, the table unchanged
stores: [files]
inputs:
  pv.2026-10-27.jsonl: {pv: {n: 12, scenarios: 2, dates: 1, seed: 1}}
  pv.2026-10-28.jsonl: {pv: {n: 12, scenarios: 2, dates: 1, seed: 2, start: '2026-10-28'}}
config: |
  source:
    files: '${in}/*'
    id: POSITION_ID
    promote: [DESK, QUANTITY]
    vectors: [SCENARIO_PV]
  target:
    format: ${store}
    lake: '${lake}'
    domain: risk
    kind: scenario-pv
    mode: replace
steps:
  - load: []
  - store: [undo, files, '${lake}', risk, scenario-pv, any-load]
