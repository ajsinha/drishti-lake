# What each built-in store cannot do (design section 4, LK-8): the capability, the reason the store states, and the parity-kit case
# that shows the refusal or the difference (none: no operation of the SPI asks for it yet; the matrix of L9 adds one).
# Every gap is closed (2026-11-21): the three stores are feature-identical (owner rule, storage parity).
# Equal to the stores' own declarations (StoreCapabilitiesTest); the list is reviewed and ONLY SHRINKS before v1.0.0.
# The gate (tools/split/compare_results.py, L9): every case of every store, memory row included, gives its Delta case's answer; a gap
# declared here as {<capability>: {reason: ..., case: <area>/<name>}} is the only way a case may differ.
# The storages are not formats: Delta, Iceberg and files tables on memory (mem://, lake-memory) and on S3 run every case as the parity
# kit's memory and S3 rows (<case>@<store>~mem, ~s3), equal to the local results (a case the kit can only set up on the local disk says
# so with its reason: local-only, not-on); no store declares a storage gap.
delta: {}
iceberg: {}
files: {}
